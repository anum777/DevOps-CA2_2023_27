name: Food Delivery CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall .

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t food-delivery-app:${{ github.sha }} .

      - name: Deployment summary
        run: |
          echo "CI completed successfully."
          echo "For the classroom demo, deploy the image to the local Kubernetes cluster using the commands in docs/EXECUTION_GUIDE.md."
