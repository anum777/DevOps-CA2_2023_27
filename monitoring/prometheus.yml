global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # If the Streamlit application is instrumented with prometheus_client,
  # expose /metrics and add its service endpoint here.
  # Example:
  # - job_name: "food-delivery-app"
  #   static_configs:
  #     - targets: ["food-delivery-service:8501"]
