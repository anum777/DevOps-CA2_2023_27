apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-delivery-app
  labels:
    app: food-delivery-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: food-delivery-app
  template:
    metadata:
      labels:
        app: food-delivery-app
    spec:
      containers:
        - name: food-delivery-app
          image: food-delivery-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: food-delivery-config
                  key: APP_ENV
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
