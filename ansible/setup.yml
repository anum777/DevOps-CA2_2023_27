---
- name: Configure runtime environment for Food Delivery service
  hosts: app
  become: true
  vars:
    app_user: foodapp
    app_dir: /opt/food-delivery-app

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - docker.io
        state: present
        update_cache: true

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Create environment configuration
      ansible.builtin.copy:
        dest: "{{ app_dir }}/app.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
        content: |
          APP_NAME=AI Food Delivery System
          APP_ENV=devops-ca2
          APP_PORT=8501

    - name: Ensure Docker service is enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
